<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Stadstrafiken</title>
</head>
<body>

    <div class="topbar">
        <button type="button" class="topbar-sok">
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <circle cx="11" cy="11" r="6.5"/>
                <line x1="15.8" y1="15.8" x2="21" y2="21"/>
            </svg>
            <span>Sök</span>
        </button>
        <img src="img/logo.svg" class="logo">
        <button type="button" class="topbar-meny">
            <span>Meny</span>
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="hero">
        <img src="img/tunnelbana-stockholm-1-1.jpg" class="hero-bild">
        <div class="flikar">
            <button type="button" class="flik aktiv" aria-pressed="true">Sök resa</button>
            <button type="button" class="flik" aria-pressed="false">Sök avgångar</button>
        </div>
    </div>

    <form class="sokpanel" action="#reseplanering" method="get">
        <div class="sokrubrik">Vart vill du åka?</div>

        <div class="falt">
            <label class="etikett" for="from">Från</label>
            <input type="text" class="input" id="from" name="from">
        </div>

        <button type="button" class="vaxla" aria-label="Byt plats på Från och Till">⇅</button>

        <div class="falt">
            <label class="etikett" for="to">Till</label>
            <input type="text" class="input" id="to" name="to">
        </div>

        <div class="falt-rad">
            <div class="falt">
                <label class="etikett" for="date">Datum</label>
                <input type="text" class="input" id="date" name="date">
            </div>
            <div class="falt">
                <label class="etikett" for="time">Tid</label>
                <input type="text" class="input" id="time" name="time">
            </div>
        </div>

        <div class="fel"></div>

        <button type="submit" class="knapp">Sök resa</button>
    </form>

    <div class="genvagar">
        <a class="genvag" href="#reseplanering">Reseplanering<span class="pil" aria-hidden="true">→</span></a>
        <a class="genvag" href="#biljetter">Biljetter<span class="pil" aria-hidden="true">→</span></a>
        <a class="genvag" href="#kundservice">Kundservice<span class="pil" aria-hidden="true">→</span></a>
        <a class="genvag" href="#aktuellt">Aktuellt<span class="pil" aria-hidden="true">→</span></a>
    </div>

    <div class="trafik">
        <div class="trafikrubrik">Trafikläget just nu</div>
        <div class="uppdaterad">Uppdaterad idag 13:26</div>

        <div class="linjekort">
            <span class="linjeikon tunnelbana"></span>
            <span class="linjenamn">Blå linjen</span>
            <span class="status ok"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon tunnelbana"></span>
            <span class="linjenamn">Röda linjen</span>
            <span class="status ok"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon tunnelbana"></span>
            <span class="linjenamn">Gröna linjen</span>
            <span class="status ok"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon pendel"></span>
            <span class="linjenamn">Pendeltåg</span>
            <span class="status varning"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon sparvagn"></span>
            <span class="linjenamn">Spårvagn och lokalbana</span>
            <span class="status info"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon buss"></span>
            <span class="linjenamn">Buss</span>
            <span class="status info"></span>
        </div>
    </div>

    <div class="fot">
        <a class="fot-lank" href="#om-stadstrafiken">Om Stadstrafiken</a>
        <a class="fot-lank" href="#kontakta-oss">Kontakta oss</a>
        <a class="fot-lank" href="#tillganglighet">Tillgänglighet</a>
    </div>

</body>
</html>
